spring:
  datasource:
    # Real MySQL, not H2. An in-memory substitute would let Flyway migrations and the
    # database-level constraints (notably the plan-exclusivity invariant, P-5.7) pass
    # silently without ever being exercised.
    url: ${ALTRIUM_TEST_DB_URL:jdbc:mysql://localhost:3306/altrium_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${ALTRIUM_DB_USER:altrium}
    password: ${ALTRIUM_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

# No Asgardeo tenant is contacted in tests. A stub JwtDecoder stands in, so the real filter
# chain and the real AltriumJwtAuthenticationConverter still run — which is the point:
# denial tests must exercise the actual security path, not a mock of it.
#
# The real decoder is switched off explicitly. Omitting issuer-uri here would not work: a
# profile file layers over application.yml rather than replacing it, so the tenant default
# stays visible and the real decoder would be built and collide with the stub.
altrium:
  security:
    asgardeo-decoder: false

logging:
  level:
    com.altrium: DEBUG
