spring:
  datasource:
    # Real MySQL, not H2. An in-memory substitute would let Flyway migrations and the
    # database-level constraints (notably the plan-exclusivity invariant, P-5.7) pass
    # silently without ever being exercised.
    url: ${ALTRIUM_TEST_DB_URL:jdbc:mysql://localhost:3306/altrium_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${ALTRIUM_DB_USER:altrium}
    password: ${ALTRIUM_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

# No Asgardeo tenant is contacted in tests. A stub JwtDecoder stands in, so the real filter
# chain and the real AltriumJwtAuthenticationConverter still run - which is the point:
# denial tests must exercise the actual security path, not a mock of it.
#
# The real decoder is switched off explicitly. Omitting issuer-uri here would not work: a
# profile file layers over application.yml rather than replacing it, so the tenant default
# stays visible and the real decoder would be built and collide with the stub.
altrium:
  security:
    asgardeo-decoder: false

  google:
    # A fixed, fake client secret, which is what makes TokenCipher usable in tests: the key is
    # derived from it, so with none set the cipher holds no key and every connection test would
    # be refused for want of configuration rather than tested. No network call is made with it
    # either way, since GoogleOAuthClient and CalendarClient are replaced in the tests that
    # exercise the flow.
    client-id: test-client-id
    client-secret: test-client-secret-not-a-real-one
    redirect-uri: http://localhost:8080/api/integrations/google/callback

  # Pinned rather than left to default, so a slot test asserts against hours it states itself.
  meetings:
    zone: Europe/London
    day-start: "09:00"
    day-end: "17:00"

  reminders:
    # The scheduled job is switched off in tests. The sweep is called directly with a date, so a
    # cron trigger firing mid-suite would only be a second, unpredictable run.
    enabled: false

    # No key, so no Resend bean is built and nothing can reach the network from a test. The
    # tests that assert what was sent replace the sender outright.
    api-key: 

logging:
  level:
    com.altrium: DEBUG
