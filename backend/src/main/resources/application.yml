spring:
  application:
    name: altrium-backend

  datasource:
    url: ${ALTRIUM_DB_URL:jdbc:mysql://localhost:3306/altrium?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${ALTRIUM_DB_USER:altrium}
    password: ${ALTRIUM_DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    # Flyway owns the schema. Hibernate must never alter it, or an "immutable migration"
    # stops being immutable in practice (constraint 7).
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  security:
    oauth2:
      resourceserver:
        jwt:
          # Asgardeo (decided, do not substitute). The backend validates JWTs against the
          # tenant's JWKS endpoint — no shared secret. See docs/asgardeo-setup.md.
          issuer-uri: ${ASGARDEO_ISSUER_URI:}

server:
  port: ${ALTRIUM_PORT:8080}
  error:
    # Never leak whether a resource exists to a caller who may not see it (P-0.5).
    include-message: never
    include-stacktrace: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.altrium: INFO
